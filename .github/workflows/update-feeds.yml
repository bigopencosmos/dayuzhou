name: update-feeds

on:
  schedule:
    # 每天 22:17 UTC = 北京时间 06:17，避开整点高峰
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "历史回填策略"
        type: choice
        default: auto
        options: [auto, always, never]
  push:
    branches: [main]
    paths:
      - "config/podcasts.json"
      - "scripts/**"
      - ".github/workflows/update-feeds.yml"

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 RSS（每 100 个播客提交推送一次）
        env:
          # 可选：只有配了这个 secret 才能做历史回填；不配就是纯「最近 15 集」模式
          XYZ_REFRESH_TOKEN: ${{ secrets.XYZ_REFRESH_TOKEN }}
          BACKFILL: ${{ inputs.backfill || 'auto' }}
        run: |
          # 全量约 6400 个，按 100 个/批切分；已完成的部分从仓库存档增量续跑
          BATCHES=64
          for i in $(seq 1 $BATCHES); do
            echo "════ 批次 $i/$BATCHES ════"
            python scripts/dayuzhou.py \
              --config config/podcasts.json \
              --out docs \
              --base-url "${{ vars.BASE_URL }}" \
              --backfill "$BACKFILL" \
              --podcast-workers 5 \
              --slice "$i/$BATCHES" || echo "批次 $i 有个别失败，继续"
            git add docs
            if git diff --cached --quiet; then
              echo "批次 $i 无变化，跳过提交"
            else
              git commit -m "chore: feeds batch $i/$BATCHES $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull --rebase origin main
              git push || echo "push 失败，保留到下一批次重试"
            fi
          done

      - name: 重建索引并提交
        if: always()
        run: |
          python scripts/dayuzhou.py \
            --config config/podcasts.json \
            --out docs \
            --base-url "${{ vars.BASE_URL }}" \
            --index-only
          git add docs
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: rebuild index $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: 汇总
        if: always()
        run: |
          echo "### dayuzhou" >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/feeds.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("docs/feeds.json"))
          rows = [f for f in d["feeds"] if not f.get("error")]
          print(f"\n{len(rows)} 个播客 · {sum(r['count'] for r in rows)} 集 · {d['updated_at']}\n")
          print("| 播客 | 集数 | 新增 | 规范 |")
          print("| --- | --- | --- | --- |")
          for r in rows[:40]:
              print(f"| {r['title']} | {r['count']} | {r.get('added', 0)} | {'✓' if r.get('apple_ok') else '!'} |")
          bad = [f for f in d["feeds"] if f.get("error")]
          if bad:
              print("\n**失败**：" + "；".join(f"{b.get('title') or b.get('slug')} — {b['error']}" for b in bad))
          PY
          fi
